name: Deploy redirect to GitHub Pages

# The docs/landing site moved to micrajs.dev (Cloudflare). This workflow now
# publishes a tiny redirect (redirect/) so old denisfl.github.io/micra.js links
# forward to the new home instead of serving the stale build. 404.html catches
# every old deep path.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./redirect
      - id: deployment
        uses: actions/deploy-pages@v5
