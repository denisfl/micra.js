name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp docs.html _site/index.html
          cp bench.html _site/bench.html
          cp -r assets _site/assets
          cp -r dist _site/dist
          if [ -d components ]; then cp -r components _site/components; fi
          if [ -d recipes ];    then cp -r recipes    _site/recipes;    fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
