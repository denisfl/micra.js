name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (includes 5.5 KB gzip bundle-size guard)
        run: npm run build

      # Keyless self-check of the LLM benchmark harness: assertions must
      # pass against the hand-written golden solutions.
      - name: LLM bench harness (golden validation)
        run: node bench-llm/evaluate.mjs --golden
