name: Publish to npm

# Staged publishing:
#   push to main     → npm publish --tag next   (install with: npm i micra@next)
#   push tag v*.*.*  → npm publish              (promotes to @latest)
#
# Before pushing to main, bump the version in package.json so npm
# doesn't reject a duplicate. Before tagging, ensure @next was tested.
#
# Required secret: NPM_TOKEN  (Settings → Secrets → Actions)
# Required npm scope: provenance needs id-token: write permission below.

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  id-token: write   # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── Staged: push to main publishes as @next ───────────────────
      - name: Publish @next (staged)
        if: github.ref == 'refs/heads/main'
        run: npm publish --tag next --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Release: version tag promotes to @latest ──────────────────
      - name: Publish @latest (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
