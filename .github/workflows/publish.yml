name: Publish to npm

# Staged publishing:
#   push to master   → npm publish --tag next, ONLY for prerelease versions
#                      (x.y.z-next.N etc.; install with: npm i micra.js@next).
#                      Stable versions are NOT published from master — otherwise
#                      the master run races the tag run, lands the version as
#                      @next first, and the tag's publish then conflicts
#                      (EPUBLISHCONFLICT) leaving @latest stale.
#   push tag v*.*.*  → npm publish → @latest
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# Setup: npmjs.com → package Settings → Trusted Publishers → add this workflow.

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # ── Staged: push to master publishes as @next ──────────────────
      # Skip when the version in package.json is already on the registry
      # (doc/site-only pushes between releases) — npm refuses to publish
      # the same version twice, and republishing @latest as @next would
      # be pointless anyway.
      - name: Publish @next (staged, prerelease versions only)
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) ;; # prerelease — eligible for the @next channel
            *)
              echo "stable version $VERSION — published only via its v$VERSION tag"
              exit 0
              ;;
          esac
          # Distinguish "version not published" (E404 → publish) from
          # transient registry/network failures (→ fail loudly, don't guess).
          set +e
          OUT=$(npm view "micra.js@$VERSION" version 2>&1)
          CODE=$?
          set -e
          if [ $CODE -eq 0 ]; then
            echo "micra.js@$VERSION already published — skipping @next publish"
          elif echo "$OUT" | grep -q "E404"; then
            npm publish --tag next --access public
          else
            echo "npm view failed with an unexpected error:"
            echo "$OUT"
            exit 1
          fi

      # ── Release: version tag promotes to @latest ──────────────────
      - name: Publish @latest (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
