name: Publish to npm

# Staged publishing:
#   push to main     → npm publish --tag next   (install with: npm i micra.js@next)
#   push tag v*.*.*  → npm publish              (promotes to @latest)
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# Setup: npmjs.com → package Settings → Trusted Publishers → add this workflow.

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── Staged: push to main publishes as @next ───────────────────
      - name: Publish @next (staged)
        if: github.ref == 'refs/heads/main'
        run: npm publish --tag next --access public

      # ── Release: version tag promotes to @latest ──────────────────
      - name: Publish @latest (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
