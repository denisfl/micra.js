<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildTrack — Micra demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] } } } };
    </script>
  </head>
  <body class="h-full bg-orange-50/60 font-sans text-zinc-900 antialiased">
    <div data-component="build" class="mx-auto max-w-4xl px-4 py-8">
      <header class="flex flex-wrap items-center gap-3">
        <span class="text-lg font-semibold tracking-tight">Build<span class="text-orange-600">Track</span></span>
        <span class="ml-auto text-sm text-zinc-500" data-text="project"></span>
      </header>

      <!-- KPIs -->
      <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
        <div class="rounded-xl bg-white p-4 ring-1 ring-zinc-950/5">
          <p class="text-sm text-zinc-500">Complete</p>
          <p class="mt-1 text-2xl font-semibold tabular-nums" data-text="overallPct() + '%'"></p>
        </div>
        <div class="rounded-xl bg-white p-4 ring-1 ring-zinc-950/5">
          <p class="text-sm text-zinc-500">Phases done</p>
          <p class="mt-1 text-2xl font-semibold tabular-nums" data-text="doneCount() + '/' + phases.length"></p>
        </div>
        <div class="rounded-xl bg-white p-4 ring-1 ring-zinc-950/5">
          <p class="text-sm text-zinc-500">Spent</p>
          <p class="mt-1 text-2xl font-semibold tabular-nums" data-text="money(totalSpent())"></p>
        </div>
        <div class="rounded-xl bg-white p-4 ring-1 ring-zinc-950/5">
          <p class="text-sm text-zinc-500">Budget</p>
          <p class="mt-1 text-2xl font-semibold tabular-nums" data-text="money(totalBudget())"></p>
          <p class="text-xs" data-bind="class:budgetNote()" data-text="budgetLabel()"></p>
        </div>
      </div>

      <!-- Phases -->
      <div class="mt-5 space-y-3">
        <template data-each="phases" data-key="id">
          <div class="rounded-xl bg-white p-4 ring-1 ring-zinc-950/5">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-medium" data-text="item.name"></span>
              <span data-bind="class:statusBadge(item)" data-text="statusOf(item)"></span>
              <span data-show="item.spent > item.budget" class="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-medium text-rose-700">Over budget</span>
              <span class="ml-auto text-sm text-zinc-500">
                <span class="tabular-nums" data-text="money(item.spent)"></span> /
                <span class="tabular-nums" data-text="money(item.budget)"></span>
              </span>
            </div>

            <div class="mt-3 flex items-center gap-3">
              <div class="h-2 flex-1 overflow-hidden rounded-full bg-zinc-100">
                <div class="h-full rounded-full bg-orange-500" data-bind="style:bar(item.progress)"></div>
              </div>
              <span class="w-10 text-right text-sm font-medium tabular-nums" data-text="item.progress + '%'"></span>
              <div class="flex gap-1">
                <button @click="drop" data-bind="data-id:item.id, disabled:item.progress === 0" class="grid h-7 w-7 place-items-center rounded-md text-zinc-500 ring-1 ring-inset ring-zinc-950/10 hover:bg-zinc-50 disabled:opacity-30">−</button>
                <button @click="bump" data-bind="data-id:item.id, disabled:item.progress === 100" class="grid h-7 w-7 place-items-center rounded-md text-zinc-500 ring-1 ring-inset ring-zinc-950/10 hover:bg-zinc-50 disabled:opacity-30">+</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/micra.js/dist/micra.min.js"></script>
    <script>
      Micra.define("build", {
        state: {
          project: "Riverside Office Build",
          phases: [
            { id: 1, name: "Site preparation", progress: 100, budget: 80000, spent: 78000 },
            { id: 2, name: "Foundation", progress: 100, budget: 150000, spent: 162000 },
            { id: 3, name: "Framing", progress: 60, budget: 220000, spent: 130000 },
            { id: 4, name: "Roofing", progress: 20, budget: 90000, spent: 18000 },
            { id: 5, name: "Mechanical, electrical & plumbing", progress: 0, budget: 140000, spent: 0 },
            { id: 6, name: "Interior finishes", progress: 0, budget: 120000, spent: 0 },
          ],
        },
        overallPct() {
          const tb = this.totalBudget();
          if (!tb) return 0;
          return Math.round(this.state.phases.reduce((n, p) => n + p.progress * p.budget, 0) / tb);
        },
        doneCount() {
          return this.state.phases.filter((p) => p.progress === 100).length;
        },
        totalBudget() {
          return this.state.phases.reduce((n, p) => n + p.budget, 0);
        },
        totalSpent() {
          return this.state.phases.reduce((n, p) => n + p.spent, 0);
        },
        budgetLabel() {
          const d = this.totalSpent() - this.totalBudget();
          return this.money(Math.abs(d)) + (d > 0 ? " over" : " under");
        },
        budgetNote() {
          return this.totalSpent() > this.totalBudget() ? "text-xs font-medium text-rose-600" : "text-xs font-medium text-emerald-600";
        },
        statusOf(p) {
          if (p.progress === 100) return "Done";
          if (p.progress > 0) return "In progress";
          return "Not started";
        },
        statusBadge(p) {
          const base = "rounded-full px-2 py-0.5 text-xs font-medium ";
          if (p.progress === 100) return base + "bg-emerald-100 text-emerald-700";
          if (p.progress > 0) return base + "bg-orange-100 text-orange-700";
          return base + "bg-zinc-100 text-zinc-500";
        },
        bar(progress) {
          return "width:" + progress + "%";
        },
        bump(e) {
          this.shift(Number(e.currentTarget.dataset.id), 10);
        },
        drop(e) {
          this.shift(Number(e.currentTarget.dataset.id), -10);
        },
        shift(id, delta) {
          this.state.phases = this.state.phases.map((p) => {
            if (p.id !== id) return p;
            const progress = Math.min(100, Math.max(0, p.progress + delta));
            // keep spend tracking progress for phases still under way (seeded
            // overruns on finished phases are preserved)
            const spent = progress === 100 ? p.spent : Math.round((p.budget * progress) / 100);
            return { ...p, progress, spent };
          });
        },
        money(n) {
          return "$" + Number(n).toLocaleString("en-US");
        },
      });
      Micra.start();
    </script>
  </body>
</html>
