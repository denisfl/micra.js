<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa1ac"/>
    </marker>
    <marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <style>
    .h{font-size:14px;fill:#1f2933;font-weight:600}
    .chip{fill:#f6f7f9;stroke:#d0d5dd;stroke-width:1.5}
    .ct{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#374151}
    .mut{font-size:12px;fill:#6b7280}
    .edge{stroke:#9aa1ac;stroke-width:1.5;fill:none}
    .iedge{stroke:#4f46e5;stroke-width:2;fill:none}
    .bucket{fill:#eef0ff;stroke:#c3c8f5;stroke-width:1.5}
    .bt{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#4f46e5;text-anchor:middle}
  </style>

  <line x1="400" y1="20" x2="400" y2="360" stroke="#e3e6ea"/>

  <!-- ───── LEFT: querySelectorAll × N ───── -->
  <text x="30" y="36" class="h">Naive: querySelectorAll</text>

  <!-- DOM outline -->
  <rect x="150" y="70" width="210" height="26" rx="6" class="chip"/><text x="162" y="88" class="ct">&lt;div data-component&gt;</text>
  <rect x="170" y="104" width="190" height="26" rx="6" class="chip"/><text x="182" y="122" class="ct">&lt;span data-text&gt;</text>
  <rect x="170" y="138" width="190" height="26" rx="6" class="chip"/><text x="182" y="156" class="ct">&lt;button @click&gt;</text>
  <rect x="170" y="172" width="190" height="26" rx="6" class="chip"/><text x="182" y="190" class="ct">&lt;p data-if&gt;</text>

  <!-- separate passes -->
  <path class="edge" marker-end="url(#g)" d="M40 96 H150"/>
  <text x="34" y="92" class="mut" text-anchor="start">[data-text]</text>
  <path class="edge" marker-end="url(#g)" d="M40 130 H170"/>
  <text x="34" y="126" class="mut" text-anchor="start">[data-if]</text>
  <path class="edge" marker-end="url(#g)" d="M40 164 H170"/>
  <text x="34" y="160" class="mut" text-anchor="start">@event</text>
  <path class="edge" marker-end="url(#g)" d="M40 198 H170"/>
  <text x="34" y="194" class="mut" text-anchor="start">[data-bind]</text>

  <text x="200" y="248" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">≈10 tree walks</text>
  <text x="200" y="268" text-anchor="middle" class="mut">on EVERY render</text>

  <!-- ───── RIGHT: TreeWalker × 1 ───── -->
  <text x="430" y="36" class="h">Micra: one TreeWalker</text>

  <rect x="540" y="70" width="210" height="26" rx="6" class="chip"/><text x="552" y="88" class="ct">&lt;div data-component&gt;</text>
  <rect x="560" y="104" width="190" height="26" rx="6" class="chip"/><text x="572" y="122" class="ct">&lt;span data-text&gt;</text>
  <rect x="560" y="138" width="190" height="26" rx="6" class="chip"/><text x="572" y="156" class="ct">&lt;button @click&gt;</text>
  <rect x="560" y="172" width="190" height="26" rx="6" class="chip"/><text x="572" y="190" class="ct">&lt;p data-if&gt;</text>

  <!-- single sweep -->
  <path class="iedge" marker-end="url(#i)" d="M524 76 V196"/>
  <text x="516" y="140" class="mut" fill="#4f46e5" transform="rotate(-90 516 140)" style="text-anchor:middle">1 pass</text>

  <!-- into buckets -->
  <path class="iedge" marker-end="url(#i)" d="M650 198 V224"/>
  <g>
    <rect x="430" y="228" width="54" height="26" rx="6" class="bucket"/><text x="457" y="245" class="bt">text</text>
    <rect x="490" y="228" width="44" height="26" rx="6" class="bucket"/><text x="512" y="245" class="bt">if</text>
    <rect x="540" y="228" width="56" height="26" rx="6" class="bucket"/><text x="568" y="245" class="bt">bind</text>
    <rect x="602" y="228" width="62" height="26" rx="6" class="bucket"/><text x="633" y="245" class="bt">model</text>
    <rect x="670" y="228" width="44" height="26" rx="6" class="bucket"/><text x="692" y="245" class="bt">on</text>
    <rect x="720" y="228" width="46" height="26" rx="6" class="bucket"/><text x="743" y="245" class="bt">ref</text>
  </g>
  <text x="598" y="288" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">→ ScanIndex</text>
  <text x="598" y="308" text-anchor="middle" class="mut">cached on the element — later renders are free</text>
</svg>
