<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="-apple-system, system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f6f7f9;stroke:#d0d5dd;stroke-width:1.5;rx:8}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#1f2933}
    .lbl{font-size:13px;fill:#1f2933}
    .mut{font-size:12px;fill:#6b7280}
    .accent{fill:#4f46e5;font-weight:600}
    .edge{stroke:#9aa1ac;stroke-width:1.5;fill:none}
  </style>

  <!-- one synchronous tick -->
  <text x="20" y="28" class="mut">one synchronous task (a click handler)</text>
  <rect x="20" y="40" width="250" height="120" rx="10" fill="none" stroke="#c7cdd6" stroke-dasharray="4 4"/>

  <rect x="38" y="56" width="214" height="28" class="box" rx="8"/>
  <text x="50" y="74" class="code">state.loading = false</text>
  <rect x="38" y="92" width="214" height="28" class="box" rx="8"/>
  <text x="50" y="110" class="code">state.page = 2</text>
  <rect x="38" y="128" width="214" height="28" class="box" rx="8"/>
  <text x="50" y="146" class="code">state.items = next</text>

  <!-- arrows into schedule -->
  <path class="edge" marker-end="url(#ar)" d="M252 70 H300 V96 H344"/>
  <path class="edge" marker-end="url(#ar)" d="M252 106 H344"/>
  <path class="edge" marker-end="url(#ar)" d="M252 142 H300 V116 H344"/>

  <!-- schedule() -->
  <rect x="346" y="62" width="220" height="92" rx="10" fill="#eef0ff" stroke="#c3c8f5" stroke-width="1.5"/>
  <text x="358" y="84" class="code accent">schedule()</text>
  <text x="358" y="106" class="mut">1st call: pending → true,</text>
  <text x="358" y="122" class="mut">queueMicrotask(flush)</text>
  <text x="358" y="142" class="mut">2nd, 3rd: pending already true → return</text>

  <!-- end of sync divider -->
  <line x1="600" y1="30" x2="600" y2="330" stroke="#c7cdd6" stroke-dasharray="5 5"/>
  <text x="610" y="28" class="mut">— end of synchronous code —</text>

  <!-- microtask -->
  <path class="edge" marker-end="url(#ar)" d="M566 108 H636"/>
  <rect x="638" y="84" width="160" height="48" rx="10" class="box"/>
  <text x="650" y="104" class="lbl">microtask queue</text>
  <text x="650" y="122" class="code">flush()</text>

  <!-- render once -->
  <path class="edge" marker-end="url(#ar)" d="M718 132 V196"/>
  <rect x="636" y="198" width="164" height="60" rx="10" fill="#ecfdf3" stroke="#a6e3c0" stroke-width="1.5"/>
  <text x="718" y="222" text-anchor="middle" class="code accent" style="fill:#16a34a">render()</text>
  <text x="718" y="244" text-anchor="middle" class="mut">one pass</text>

  <text x="410" y="300" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="600">3 state writes → 1 render, not 3</text>
</svg>
