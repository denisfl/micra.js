<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alpine bench frame</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; font-size: 12px; padding: 8px; color: #666; }
    </style>
    <!-- Silence Alpine's "can't redefine non-configurable property" error — a known
         Alpine 3.x bug when magic properties (like $nextTick) are registered more
         than once. Does not affect timing measurements. -->
    <script>
      window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('non-configurable')) e.preventDefault()
      })
    </script>
    <!-- Defer global init so we control timing -->
    <script>window.deferLoadingAlpine = (start) => { window.__startAlpine = start }</script>
    <script defer src="../../vendors/alpine-3.14.1.min.js"></script>
  </head>
  <body>
    <small>Isolated benchmark frame: <strong>Alpine.js 3.14.1</strong></small>
    <script type="module">
      import { adapter } from '../../adapters/alpine.adapter.js'
      import { setupFrame } from '../frame.js'
      // Wait for Alpine script to attach
      await new Promise(r => window.addEventListener('load', r))
      // Start Alpine to make .reactive() and other API available.
      // The MutationObserver Alpine sets up is *inside this iframe's document*
      // only — it can't interfere with the parent or sibling frames.
      if (window.__startAlpine) window.__startAlpine()
      setupFrame(adapter)
    </script>
  </body>
</html>
