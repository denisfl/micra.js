<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Filters</title>
  </head>
  <body>
    <!-- Dropdown Filters -->
    <div data-component="user-filters">
      <select id="filter1" data-model="filter1" @change="applyFilters">
        <option value="all">All Users</option>
        <option value="active">Active Users</option>
        <option value="inactive">Inactive Users</option>
      </select>

      <select id="filter2" data-model="filter2" @change="applyFilters">
        <option value="all">All Roles</option>
        <option value="admin">Admins Only</option>
        <option value="normal">Normal Users</option>
      </select>

      <!-- User Table -->
      <table border="1">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <template data-each="filteredUsers" data-key="email">
            <tr>
              <td data-text="name"></td>
              <td data-text="email"></td>
            </tr>
          </template>
        </tbody>
      </table>

      <p data-if="loading">Loading...</p>
      <p data-if="!filteredUsers.length && !loading">No users found.</p>
    </div>

    <script src="dist/micra.js"></script>
    <script>
      Micra.define("user-filters", {
        state: {
          users: [],
          filteredUsers: [],
          filter1: "all",
          filter2: "all",
          loading: true,
        },
        async onCreate() {
          // Simulate fetching data
          this.state.users = await this.fetchUsers();
          this.state.filteredUsers = this.state.users;
          this.state.loading = false;
        },
        async fetchUsers() {
          // Replace this with an actual API call if needed
          return [
            {
              name: "John Doe",
              email: "johndoe@example.com",
              status: "active",
              role: "admin",
            },
            {
              name: "Jane Smith",
              email: "janesmith@example.com",
              status: "inactive",
              role: "normal",
            },
            {
              name: "Alice Johnson",
              email: "alicejohnson@example.com",
              status: "active",
              role: "normal",
            },
            {
              name: "Bob Williams",
              email: "bobwilliams@example.com",
              status: "inactive",
              role: "admin",
            },
            {
              name: "Charlie Brown",
              email: "charliebrown@example.com",
              status: "active",
              role: "normal",
            },
          ];
        },
        applyFilters() {
          const { filter1, filter2, users } = this.state;
          this.state.filteredUsers = users.filter((user) => {
            const statusMatch = filter1 === "all" || user.status === filter1;
            const roleMatch = filter2 === "all" || user.role === filter2;
            return statusMatch && roleMatch;
          });
        },
      });

      Micra.start();
    </script>
  </body>
</html>
